# Render Blueprint: Msgr as one free web service, built from the Dockerfile.
# The database lives elsewhere (Neon's free Postgres); see docs/deploying.md.
services:
  - type: web
    name: msgr
    runtime: docker
    plan: free
    # Next to the database. Fixed once the service exists.
    region: frankfurt
    autoDeployTrigger: checksPass
    healthCheckPath: /
    # The app's own address comes from Render's RENDER_EXTERNAL_URL.
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Who may see the admin page (Special → Storage…), comma-separated.
      - key: ADMIN_EMAILS
        sync: false
      # The database plan's storage allowance, for the admin page's "left".
      - key: STORAGE_LIMIT_MB
        sync: false
