name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    services:
      # A disposable server: the repository contract truncates msgr_test, and
      # the e2e run makes its own msgr_e2e beside it.
      # From Google's mirror of Docker Hub, as the Dockerfile's images are:
      # runners share addresses, which use up anonymous pull limits elsewhere.
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: msgr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/msgr_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Migrate the test database
        run: npm --workspace=@msgr/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Install Chromium for the e2e tests
        run: npm --workspace=@msgr/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
        env:
          E2E_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Keep traces of failed e2e tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/e2e/test-results
          retention-days: 7

  docker:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t msgr .
